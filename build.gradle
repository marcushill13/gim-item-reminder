plugins { id 'java' }
repositories {
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex 'net\\.runelite.*' } }
    mavenCentral()
}
def runeLiteVersion = 'latest.release'
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
}
group = 'com.gimreminder'
version = '0.7.0'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 11 }

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.gimreminder.GimReminderPluginTest'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}
